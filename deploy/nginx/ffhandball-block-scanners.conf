# Installé dans /etc/nginx/snippets/ et inclus dans les blocs server (API et site).
#
# Coupe sans réponse (444 : nginx ferme la connexion) les sondes de scanners automatiques qui
# cherchent des fichiers sensibles ou des logiciels que ce serveur n'a pas : .env, .git, PHP,
# WordPress, phpunit, API Docker… Ces requêtes ne méritent ni une réponse, ni un passage par
# l'application Node, ni une ligne dans les statistiques.
#
# Ne protège de rien de plus (ces chemins n'existent pas, ils renvoyaient déjà 404) : c'est de
# l'hygiène. /.well-known/ (validation Let's Encrypt) n'est volontairement PAS concerné.

# Fichiers cachés sensibles, à n'importe quelle profondeur : /.env, /.env.bak, /app/.git/config, /.aws/credentials…
location ~* (^|/)\.(env|git|svn|hg|aws|ssh|docker|npmrc|htaccess|htpasswd|ds_store|vscode|idea) {
    return 444;
}

# Langages et logiciels absents ici
location ~* \.(php[0-9]?|phtml|asp|aspx|jsp|cgi|pl)$ {
    return 444;
}

# Chemins classiques d'exploitation (WordPress, phpMyAdmin, phpunit, Docker, Spring, routeurs…)
location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|wordpress|xmlrpc|phpmyadmin|pma|vendor/phpunit|cgi-bin|boaform|actuator|containers/json|solr|manager/html|HNAP1|owa|ecp)(/|$|\.) {
    return 444;
}
