services:
  postgres:
    image: postgres:16-alpine
    container_name: ffhandball-postgres
    environment:
      POSTGRES_USER: ffhandball
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ffhandball}
      POSTGRES_DB: ffhandball
    ports:
      - "5432:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ffhandball -d ffhandball"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: ffhandball-adminer
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
